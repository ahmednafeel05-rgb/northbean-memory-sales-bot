services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northbean
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://app_user:app_user_dev_only@db:5432/northbean
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@db:5432/northbean
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-key.json
    env_file:
      - .env
    volumes:
      - type: bind
        source: ${GCP_KEY_HOST_PATH}
        target: /run/secrets/gcp-key.json
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
